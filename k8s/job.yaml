apiVersion: batch/v1
kind: Job
metadata:
  name: log-monitor-job
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: monitor
        image: log-monitor:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "monitor.py" ]
        args: ["0.5"]
